# Netlify build and context configuration.
#
# Redirect rules live in public/_redirects, not here — keeping them in one file
# avoids two places that both claim to define routing. This file exists for the
# things _redirects cannot express: headers, and per-context behaviour.

[build]
  command = "npm run build"
  publish = "dist"

# --- Deploy previews and branch deploys must not be indexable ----------------
#
# A preview is a byte-identical copy of the whole site on a different hostname.
# Crawled, it becomes a duplicate of every page and competes with production —
# and because the prerendered HTML hardcodes production canonicals, a preview
# would also feed Google canonical tags pointing at devhub.my from a host that
# is not devhub.my.
#
# Phase 13 asks for both mechanisms, because they do different jobs:
# X-Robots-Tag keeps the page out of the index even when it is linked from
# elsewhere, and the staging robots.txt stops the crawl in the first place.

[[context.deploy-preview.headers]]
  for = "/*"
  [context.deploy-preview.headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[context.branch-deploy.headers]]
  for = "/*"
  [context.branch-deploy.headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[context.deploy-preview.redirects]]
  from = "/robots.txt"
  to = "/staging/robots.txt"
  status = 200
  force = true

[[context.branch-deploy.redirects]]
  from = "/robots.txt"
  to = "/staging/robots.txt"
  status = 200
  force = true
