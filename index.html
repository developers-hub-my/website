<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--
      Per-page tags are NOT written here.

      Title, description, robots, canonical, the OG/Twitter pair and the single
      JSON-LD @graph are all injected below by scripts/prerender.mjs, from the
      values src/hooks/useSeo.ts collects while the page renders. Adding any of
      them back to this file would put the same value on every URL — which is
      exactly the state the 1 Sep 2026 audit found, where all nineteen URLs
      canonicalised to the homepage.

      Three hand-written JSON-LD blocks used to live here (Organization,
      LocalBusiness, WebSite). They were removed wholesale rather than repaired,
      per the Phase 05 pre-work instruction: three separate blocks break R1, the
      empty "telephone" broke R5, the LocalBusiness @id did not match the
      registry, and the WebSite block advertised a SearchAction for a site
      search that does not exist. src/lib/schema.ts replaces all of it.

      Also gone, deliberately: meta keywords, author, language and revisit-after
      (dead signals), and the geo.* / ICBM pair — location is expressed properly
      by GeoCoordinates inside LocalBusiness, and these would otherwise be
      stamped onto every page of the site rather than the ones about the office.
    -->
    <!--app-head-->

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#1e40af" />
    <meta name="msapplication-TileColor" content="#1e40af" />

    <!-- Site-wide social defaults; the per-page values are injected above. -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="en_MY" />
    <meta property="og:site_name" content="Developers Hub" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- RSS -->
    <link rel="alternate" type="application/rss+xml" title="Developers Hub Blog" href="/rss.xml" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body class="font-sans antialiased">
    <!-- The Meta Pixel no-JS fallback is injected here at build time, and only
         when VITE_META_PIXEL_ID is set — see metaPixelNoscript() in
         vite.config.ts. The JS half (SPA route tracking) is in
         src/lib/meta-pixel.ts. -->
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
