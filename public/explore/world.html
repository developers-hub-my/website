<style>
:root{--ink:#0f172a;--ink-2:#1e293b;--rule:#334155;--text:#e2e8f0;--muted:#94a3b8;--brand:#60a5fa;--live:#22d3ee;--soon:#fbbf24}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--ink);color:var(--text);font-family:Inter,ui-sans-serif,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;overflow:hidden;-webkit-font-smoothing:antialiased}
#stage{position:fixed;inset:0}
body.embed header{display:none}
header{position:fixed;top:20px;left:24px;pointer-events:none;max-width:440px;background:rgba(7,13,26,.55);padding:14px 18px;border-radius:12px;backdrop-filter:blur(6px)}
.kicker{font-size:11px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--brand);margin:0 0 6px}
h1{font-size:28px;font-weight:800;letter-spacing:-.03em;margin:0 0 6px}
header p{margin:0;color:var(--muted);font-size:14px;font-weight:300;line-height:1.5}
.stats{position:fixed;left:24px;bottom:20px;display:flex;gap:22px;pointer-events:none;background:rgba(7,13,26,.55);padding:10px 16px;border-radius:12px;backdrop-filter:blur(6px)}
.stats div{font-size:11px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.stats b{display:block;font-size:24px;color:#fff;letter-spacing:-.03em;text-transform:none;font-variant-numeric:tabular-nums}
#panel{position:fixed;right:20px;top:20px;width:320px;background:rgba(15,23,42,.88);border:1px solid var(--rule);border-radius:12px;padding:18px 20px;backdrop-filter:blur(8px);transition:opacity .3s,transform .3s}
#panel.hide{opacity:0;transform:translateY(-8px);pointer-events:none}
#panel h2{font-size:18px;margin:0 0 4px;letter-spacing:-.02em}
#panel .tag{font-size:10px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--brand)}
#panel p{font-size:13px;color:#cbd5e1;font-weight:300;line-height:1.55;margin:8px 0}
#panel ul{margin:8px 0 0;padding:0;list-style:none}
#panel li{font-size:13px;padding:6px 0;border-top:1px solid var(--ink-2);display:flex;justify-content:space-between;gap:10px}
.pill{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:2px 7px;border-radius:99px;white-space:nowrap}
.pill.live{color:var(--ink);background:var(--live)}
.pill.soon{color:var(--soon);border:1px dashed var(--soon)}
#caption{position:fixed;left:50%;bottom:78px;transform:translateX(-50%);max-width:min(640px,calc(100% - 32px));text-align:center;font-size:17px;font-weight:300;line-height:1.45;color:#e2e8f0;background:rgba(7,13,26,.78);border:1px solid var(--rule);border-radius:12px;padding:12px 20px;backdrop-filter:blur(8px);transition:opacity .4s}

const R = 13.5; // district ring radius
const RING = 20; // sector ring radius

const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const stage = document.getElementById('stage');

const labels = new CSS2DRenderer();

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x070d1a);

const camera = new THREE.PerspectiveCamera(38, innerWidth/innerHeight, .1, 200);
const HOME = { pos:new THREE.Vector3(52,25,52), target:new THREE.Vector3(0,-3.5,0) };
camera.position.copy(HOME.pos);

controls.minDistance = 3; controls.maxDistance = 120;

// Bloom only catches emissive/neon (threshold above lit-white), so surfaces stay crisp
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene,camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth,innerHeight), .7, .5, 1.25);
composer.addPass(bloom);
composer.addPass(new OutputPass());

// Light: moonlit cool key, low hemisphere, a cyan practical below the hub mark
const hemi = new THREE.HemisphereLight(0x93c5fd, 0x070d1a, .35); scene.add(hemi);
const key = new THREE.DirectionalLight(0xdbeafe, 1.0);
key.position.set(14,26,10); key.castShadow = true;
key.shadow.mapSize.set(2048,2048);
Object.assign(key.shadow.camera,{left:-32,right:32,top:32,bottom:-32,near:1,far:110});
key.shadow.bias = -0.0005;
scene.add(key);
const spireLight = new THREE.PointLight(0x38bdf8, 5, 12, 2);
spireLight.position.set(0,6.5,0);
scene.add(spireLight);

const neon = (hex, k=3) => new THREE.MeshBasicMaterial({ color:new THREE.Color(hex).multiplyScalar(k), toneMapped:false });
const M = {
  floor: new THREE.MeshStandardMaterial({ color:0x0b1324, roughness:.38, metalness:.7, envMapIntensity:.12, userData:{ kind:'floor' } }),
  graphite: new THREE.MeshPhysicalMaterial({ color:0x1b2638, roughness:.32, metalness:.85, clearcoat:.6, clearcoatRoughness:.2, envMapIntensity:.22, userData:{ kind:'graphite' } }),
  hull: new THREE.MeshPhysicalMaterial({ color:0xcfd8e6, roughness:.25, metalness:.15, clearcoat:1, clearcoatRoughness:.1, envMapIntensity:.55, userData:{ kind:'hull' } }),
  hullFacet: new THREE.MeshPhysicalMaterial({ color:0xcfd8e6, roughness:.22, metalness:.2, clearcoat:1, clearcoatRoughness:.08, flatShading:true, envMapIntensity:.6 }),
  brand: new THREE.MeshPhysicalMaterial({ color:0x2563eb, roughness:.25, metalness:.4, clearcoat:1, clearcoatRoughness:.1 }),
  glass: new THREE.MeshPhysicalMaterial({ color:0xbfe6ff, roughness:.05, metalness:.1, transparent:true, opacity:.35, depthWrite:false, envMapIntensity:1.2 }), // no transmission: it re-renders the scene every frame
  cyanSoft: new THREE.MeshPhysicalMaterial({ color:0x0e7490, emissive:0x22d3ee, emissiveIntensity:.8, roughness:.3, metalness:.4 }),
  cyan: neon(0x22d3ee), blue: neon(0x3b82f6, 3.4), amber: neon(0xfbbf24, 2.6),

const mesh = (g, m, x=0, y=0, z=0) => { const o = new THREE.Mesh(g, m); o.position.set(x,y,z); o.castShadow = o.receiveShadow = true; return o; };
const glow = (g, m, x=0, y=0, z=0) => { const o = new THREE.Mesh(g, m); o.position.set(x,y,z); return o; };
const hexRing = (r, t, m, y) => { const o = glow(new THREE.TorusGeometry(r,t,6,6), m, 0,y,0); o.rotation.set(Math.PI/2,0,Math.PI/6); return o; };
const label = (html, cls, y, parent) => { const d = document.createElement('div'); d.className = 'lbl '+cls; d.innerHTML = html; const o = new CSS2DObject(d); o.position.y = y; parent.add(o); return d; };
const spin = [], bob = [], logos = [];

// Soft radial glow sprite, reused under slabs and the spire
const glowTex = (()=>{ const c = document.createElement('canvas'); c.width = c.height = 128; const x = c.getContext('2d');
  const g = x.createRadialGradient(64,64,0,64,64,64); g.addColorStop(0,'rgba(56,189,248,.55)'); g.addColorStop(1,'rgba(56,189,248,0)');
  x.fillStyle = g; x.fillRect(0,0,128,128); return new THREE.CanvasTexture(c); })();
const pools = [];
const pool = (r, y=.02, op=1) => { const o = new THREE.Mesh(new THREE.PlaneGeometry(r*2,r*2), new THREE.MeshBasicMaterial({ map:glowTex, transparent:true, opacity:op, depthWrite:false, blending:THREE.AdditiveBlending }));
  o.rotation.x = -Math.PI/2; o.position.y = y; pools.push(o); return o; };

// Floor, grid, ambient motes
// ── The continent: an irregular grassy landmass floating in a void. Its underside is earth — soil under the turf, then
// rock, tapering to a point — with water seeping out and falling away. Islets of different sizes drift round it.
// Seeded, so every load is the same shape.
const rand = (seed=>()=>{ seed |= 0; seed = seed+0x6D2B79F5|0; let t = Math.imul(seed^seed>>>15, 1|seed); t = t+Math.imul(t^t>>>7, 61|t)^t; return ((t^t>>>14)>>>0)/4294967296; })(20200);
const EARTH = [[0,0x3d6b45],[.04,0x5b3f2b],[.25,0x6e4c33],[.5,0x4d4038],[.8,0x3a3431],[1,0x2a2627]].map(([k,c])=>[k,new THREE.Color(c)]); // turf lip → soil → rock
function landmass(outline, layers){ // outline: [[x,z]] at y 0; layers: [scale, y, jitter] going down; ends in a point
  const rings = [outline.map(([x,z])=>new THREE.Vector3(x,0,z))];
  layers.forEach(([k,y,j])=>rings.push(outline.map(([x,z])=>new THREE.Vector3(x*k*(1+(rand()-.5)*j), y+(rand()-.5)*j*4, z*k*(1+(rand()-.5)*j)))));
  const tip = new THREE.Vector3((rand()-.5)*2, layers.at(-1)[1]*1.35, (rand()-.5)*2), pos = [], col = [], n = outline.length, depth = -tip.y, c = new THREE.Color();
  const tint = y=>{ const k = Math.min(1,-y/depth); for (let i=1;i<EARTH.length;i++) if (k<=EARTH[i][0]) return c.copy(EARTH[i-1][1]).lerp(EARTH[i][1],(k-EARTH[i-1][0])/(EARTH[i][0]-EARTH[i-1][0])); return c.copy(EARTH.at(-1)[1]); };
  const tri = (a,b,d)=>[a,b,d].forEach(v=>{ pos.push(v.x,v.y,v.z); const t = tint(v.y); col.push(t.r,t.g,t.b); });
  for (let r=0;r<rings.length-1;r++) for (let i=0;i<n;i++){ const a = rings[r][i], b = rings[r][(i+1)%n], d = rings[r+1][i], e = rings[r+1][(i+1)%n]; tri(a,d,b); tri(b,d,e); }
  const last = rings.at(-1); for (let i=0;i<n;i++) tri(last[i], tip, last[(i+1)%n]);
  const geo = new THREE.BufferGeometry(); geo.setAttribute('position', new THREE.Float32BufferAttribute(pos,3)); geo.setAttribute('color', new THREE.Float32BufferAttribute(col,3)); geo.computeVertexNormals();
  const top = new THREE.Shape(outline.map(([x,z])=>new THREE.Vector2(x,-z)));
  return { under:geo, top:new THREE.ShapeGeometry(top).rotateX(-Math.PI/2), rings, tip };
}
const coastR = a=>26+1.9*Math.sin(3*a+.5)+1.2*Math.sin(5*a+1.3)+.7*Math.sin(9*a+2)+.4*Math.sin(17*a); // a = atan2(z, x)
const coast = Array.from({length:140},(_,i)=>{ const a = i/140*Math.PI*2, r = coastR(a); return [Math.cos(a)*r, Math.sin(a)*r]; });
const grass = new THREE.MeshStandardMaterial({ color:0x35623f, roughness:.95, flatShading:true });
const earth = new THREE.MeshStandardMaterial({ vertexColors:true, roughness:1, metalness:0, flatShading:true, side:THREE.DoubleSide });
const continent = new THREE.Group(); scene.add(continent);
const MAIN = landmass(coast, [[.985,-.8,.01],[.93,-2.6,.05],[.8,-5.2,.08],[.62,-8,.1],[.42,-11,.12],[.22,-14,.14]]);
continent.add(mesh(MAIN.top, grass)); continent.add(mesh(MAIN.under, earth));

// ── Water: shared flowing textures, a ribbon builder, and a falling-water sheet that fades out
const flowTex = (w,h,base,streak)=>canvasTex(w,h,x=>{ x.fillStyle = base; x.fillRect(0,0,w,h); for (let i=0;i<70;i++){ x.fillStyle = streak; x.globalAlpha = .25+rand()*.5; x.fillRect(rand()*w, rand()*h, 1+rand()*3, 10+rand()*50); } x.globalAlpha = 1; });
const UP = new THREE.Vector3(0,1,0);
const ribbon = (curve, widthAt, sideAt, N=120)=>{ const pos = [], uv = [], uv1 = [], idx = [], len = curve.getLength();
  for (let i=0;i<=N;i++){ const u = i/N, P = curve.getPointAt(u), S = sideAt(u, curve.getTangentAt(u)).multiplyScalar(widthAt(u)/2);
    pos.push(P.x+S.x,P.y+S.y,P.z+S.z, P.x-S.x,P.y-S.y,P.z-S.z); uv.push(0,u*len/3, 1,u*len/3); uv1.push(0,u, 1,u);
    if (i<N) idx.push(i*2,i*2+1,i*2+2, i*2+1,i*2+3,i*2+2); }
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(pos,3)); g.setAttribute('uv', new THREE.Float32BufferAttribute(uv,2));
  g.setAttribute('uv1', new THREE.Float32BufferAttribute(uv1,2)); g.setIndex(idx); g.computeVertexNormals(); return g; };
const waterTex = flowTex(128,512,'#1f6fa6','#bfe6ff'); waterTex.wrapS = waterTex.wrapT = THREE.RepeatWrapping;
const water = new THREE.MeshStandardMaterial({ map:waterTex, roughness:.12, metalness:.1, envMapIntensity:1.2, side:THREE.DoubleSide });
const fallTex = flowTex(128,512,'#9fd3f1','#ffffff'); fallTex.wrapS = fallTex.wrapT = THREE.RepeatWrapping;
const fallAlpha = canvasTex(4,256,x=>{ const g = x.createLinearGradient(0,0,0,256); g.addColorStop(0,'#000'); g.addColorStop(.06,'#fff'); g.addColorStop(.45,'#ccc'); g.addColorStop(.85,'#000'); g.addColorStop(1,'#000'); x.fillStyle = g; x.fillRect(0,0,4,256); });
fallAlpha.colorSpace = THREE.NoColorSpace; fallAlpha.flipY = false; fallAlpha.channel = 1; // uv1.v runs 0 at the lip → 1 at the end
const fallMat = new THREE.MeshStandardMaterial({ map:fallTex, alphaMap:fallAlpha, transparent:true, opacity:.9, roughness:.2, depthWrite:false, side:THREE.DoubleSide, emissive:0x2a5d7a, emissiveIntensity:.35 });
function waterfall(parent, lip, out, height, width, sideOverride){ // a sheet that curls off `lip` along `out`, narrowing as it falls
  const side = sideOverride || new THREE.Vector3(-out.z,0,out.x).normalize(), o = out.clone().setY(0);
  const c = new THREE.CatmullRomCurve3([lip, lip.clone().addScaledVector(o,.35*width).setY(lip.y-.15*width), lip.clone().addScaledVector(o,.7*width).setY(lip.y-height*.17),
    lip.clone().addScaledVector(o,.95*width).setY(lip.y-height*.55), lip.clone().addScaledVector(o,1.1*width).setY(lip.y-height)]);
  const m = new THREE.Mesh(ribbon(c, u=>width*(1-u*.35)+Math.sin(u*9)*.04*width, ()=>side.clone(), 60), fallMat); parent.add(m); return m; }

// river: out of the moat round the hub, meandering to the coast, then over the edge
const RA = Math.PI/4, rivPts = [[8.2,0],[10.8,.06],[13.4,-.05],[16,.05],[18.6,-.04],[21.2,.03],[23.6,-.02]].map(([r,da])=>new THREE.Vector3(Math.cos(RA+da)*r,.07,Math.sin(RA+da)*r));
const lip = (()=>{ const a = Math.atan2(rivPts.at(-1).z,rivPts.at(-1).x), r = coastR(a); return new THREE.Vector3(Math.cos(a)*(r+.05),.07,Math.sin(a)*(r+.05)); })();
rivPts.push(lip);
const river = new THREE.CatmullRomCurve3(rivPts, false, 'centripetal');
{ const m = new THREE.Mesh(ribbon(river, u=>.8+u*.6, (u,T)=>new THREE.Vector3().crossVectors(T,UP).normalize()), water); m.receiveShadow = true; continent.add(m); }
// moat round the hub: the bridges cross it, the river leaves it
continent.add(mesh(new THREE.RingGeometry(5.55,8.5,96).rotateX(-Math.PI/2), water, 0,.06,0));
const out = lip.clone().setY(0).normalize();
waterfall(continent, lip, out, 9.5, 1.15);
// water seeping from the rock: streams off the underside, and a thread from the tip
[.2,1.2,-.5].forEach(a=>{ const ring = MAIN.rings[2], i = Math.round(((a+Math.PI*2)%(Math.PI*2))/(Math.PI*2)*ring.length)%ring.length, p = ring[i].clone(), o = p.clone().setY(0).normalize();
  waterfall(continent, p.addScaledVector(o,.15), o, 10+rand()*4, .45); });
waterfall(continent, MAIN.tip.clone(), new THREE.Vector3(.01,0,0), 9, .35, new THREE.Vector3(1,0,0));
waterfall(continent, MAIN.tip.clone(), new THREE.Vector3(0,0,.01), 9, .35, new THREE.Vector3(0,0,1));
// drops falling from the underside, mist below the main fall
const FALL = 260, fallPos = new Float32Array(FALL*3), fallSeed = [];
for (let i=0;i<FALL;i++){ const ring = MAIN.rings[2+Math.floor(rand()*4)], p = ring[Math.floor(rand()*ring.length)]; fallSeed.push([p.x*.98,p.y,p.z*.98,rand()*.6+.4]);
  fallPos.set([p.x*.98, p.y-rand()*14, p.z*.98], i*3); }
const drops = new THREE.Points(new THREE.BufferGeometry().setAttribute('position', new THREE.BufferAttribute(fallPos,3)),
  new THREE.PointsMaterial({ color:0xbfe6ff, size:.08, transparent:true, opacity:.7, depthWrite:false }));
continent.add(drops);
const MIST = 220, mistPos = new Float32Array(MIST*3), mistSeed = [];
for (let i=0;i<MIST;i++){ const top = i<50, c = top ? lip.clone().addScaledVector(out,.4) : lip.clone().addScaledVector(out,1.15).setY(-7.5);
  const o = [ (rand()-.5)*(top?1.4:3.5), rand()*(top?.6:3), (rand()-.5)*(top?1.4:3.5) ]; mistSeed.push([c,o,rand()]); mistPos.set([c.x+o[0], c.y+o[1], c.z+o[2]], i*3); }
const mist = new THREE.Points(new THREE.BufferGeometry().setAttribute('position', new THREE.BufferAttribute(mistPos,3)),
  new THREE.PointsMaterial({ color:0xdff3ff, size:.16, transparent:true, opacity:.55, depthWrite:false }));
continent.add(mist);

// ── Hills, clear of the hub, the districts, the sector ring and the river
const DIST = [0,Math.PI/2,Math.PI,-Math.PI/2].map(a=>new THREE.Vector2(Math.cos(a)*R,Math.sin(a)*R));
const hillGrass = new THREE.MeshStandardMaterial({ color:0x3f7349, roughness:.95, flatShading:true });
function hillMesh(R0,H){ const g = new THREE.SphereGeometry(1,11,6,0,Math.PI*2,0,Math.PI/2), p = g.attributes.position;
  for (let i=0;i<p.count;i++) if (p.getY(i)>.05){ p.setX(i,p.getX(i)*(1+(rand()-.5)*.18)); p.setZ(i,p.getZ(i)*(1+(rand()-.5)*.18)); p.setY(i,p.getY(i)*(1+(rand()-.5)*.25)); }
  g.computeVertexNormals(); const m = mesh(g, hillGrass); m.scale.set(R0,H,R0); return m; }
const HILLS = [[3*Math.PI/4,14.6,2.7,1.5],[-3*Math.PI/4,14.8,2.9,1.7],[-Math.PI/4,14.6,2.5,1.3]].map(([a,r,R0,H])=>({ x:Math.cos(a)*r, z:Math.sin(a)*r, R:R0, H }));
for (let a=.1; a<Math.PI*2; a+=.62){ if (Math.abs(a-RA)<.35) continue; const r = coastR(a)-3.3, R0 = 1.7+rand()*1.2; if (r-R0 < RING+.8) continue;
  HILLS.push({ x:Math.cos(a)*r, z:Math.sin(a)*r, R:R0, H:.8+rand()*1.1 }); }
HILLS.forEach(h=>{ const m = hillMesh(h.R,h.H); m.position.set(h.x,0,h.z); continent.add(m); });
const groundY = (x,z,hills=HILLS)=>hills.reduce((y,h)=>{ const d = Math.hypot(x-h.x,z-h.z)/h.R; return d<1 ? Math.max(y, h.H*Math.sqrt(1-d*d)) : y; }, 0);

// ── Trees: pines and round trees, instanced, with colour variation; they grow on the hills too
const GREENS = [0x2f6b3f,0x3b7d4a,0x285c3a,0x4a8a55,0x356f45].map(c=>new THREE.Color(c));
const trunkMat = new THREE.MeshStandardMaterial({ color:0x5b4636, roughness:.9 });
const leafMat = new THREE.MeshStandardMaterial({ roughness:.85, flatShading:true });
const TREE = [{ leaf:new THREE.ConeGeometry(.42,1.25,7).translate(0,1.05,0), trunk:new THREE.CylinderGeometry(.06,.08,.5,6).translate(0,.25,0) },
              { leaf:new THREE.IcosahedronGeometry(.5,0).translate(0,1.0,0), trunk:new THREE.CylinderGeometry(.06,.09,.6,6).translate(0,.3,0) }];
function forest(parent, spots, yAt){ // spots: [x, z, variety 0..1]
  TREE.forEach((k,ki)=>{ const mine = spots.filter(s2=>(s2[2]<.55)===(ki===0)); if (!mine.length) return;
    const leaves = new THREE.InstancedMesh(k.leaf, leafMat, mine.length), trunks = new THREE.InstancedMesh(k.trunk, trunkMat, mine.length), m4 = new THREE.Matrix4(), q = new THREE.Quaternion();
    mine.forEach(([x,z,v],i)=>{ const sc = .7+((v*997)%1)*.7; m4.compose(new THREE.Vector3(x,yAt(x,z)-.05,z), q.setFromAxisAngle(UP,v*7), new THREE.Vector3(sc,sc*(ki?1:1.15),sc));
      leaves.setMatrixAt(i,m4); trunks.setMatrixAt(i,m4); leaves.setColorAt(i, GREENS[Math.floor(v*50)%GREENS.length]); });
    for (const im of [leaves,trunks]){ im.castShadow = im.receiveShadow = true; parent.add(im); } }); }
const rivSamples = Array.from({length:80},(_,i)=>river.getPointAt(i/79));
const free = (x,z)=>{ const r = Math.hypot(x,z), a = Math.atan2(z,x);
  if (r<9.3 || r>coastR(a)-1 || Math.abs(r-RING)<.9) return false;
  if (DIST.some(d=>Math.hypot(x-d.x,z-d.y)<5.7)) return false;
  return !rivSamples.some(p=>Math.hypot(x-p.x,z-p.z)<1.4); };
const spots = []; for (let tries=0; spots.length<300 && tries<9000; tries++){ const a = rand()*Math.PI*2, r = 9+rand()*18, x = Math.cos(a)*r, z = Math.sin(a)*r;
  if (free(x,z) && !spots.some(s2=>Math.hypot(s2[0]-x,s2[1]-z)<.9)) spots.push([x,z,rand()]); }
// leave a meadow open for the sheep
const MEADOW = new THREE.Vector2(Math.cos(3.5)*22.5, Math.sin(3.5)*22.5);
forest(continent, spots.filter(([x,z])=>Math.hypot(x-MEADOW.x,z-MEADOW.y)>3.2), groundY);

// ── Animals: grazing sheep, deer by the woods, birds that fly out from the continent and come back
const wool = new THREE.MeshStandardMaterial({ color:0xe9e6dd, roughness:1, flatShading:true }), hoof = new THREE.MeshStandardMaterial({ color:0x2b2a2a, roughness:.8 });
const hide = new THREE.MeshStandardMaterial({ color:0x8a5a3b, roughness:.9, flatShading:true }), antler = new THREE.MeshStandardMaterial({ color:0xd9c7a3, roughness:.8 });
const grazers = [];
function sheep(parent,x,y,z,heading){ const g = new THREE.Group(); g.position.set(x,y,z); g.rotation.y = heading; parent.add(g);
  g.add(mesh(new THREE.IcosahedronGeometry(1,1).scale(.3,.22,.2), wool, 0,.34,0));
  for (const [lx,lz] of [[.15,.09],[.15,-.09],[-.15,.09],[-.15,-.09]]) g.add(mesh(new THREE.CylinderGeometry(.025,.025,.2,6), hoof, lx,.1,lz));
  const head = new THREE.Group(); head.position.set(.27,.36,0); g.add(head); head.add(mesh(new THREE.BoxGeometry(.15,.12,.11), hoof, .07,0,0));
  grazers.push({ head, o:rand()*6, dip:.7 }); }
function deer(parent,x,y,z,heading){ const g = new THREE.Group(); g.position.set(x,y,z); g.rotation.y = heading; parent.add(g);
  g.add(mesh(new THREE.IcosahedronGeometry(1,1).scale(.36,.17,.13), hide, 0,.58,0));
  for (const [lx,lz] of [[.22,.07],[.22,-.07],[-.22,.07],[-.22,-.07]]) g.add(mesh(new THREE.CylinderGeometry(.022,.018,.48,6), hide, lx,.24,lz));

for (let i=0;i<8;i++){ const a = rand()*Math.PI*2, r = rand()*2.6, x = MEADOW.x+Math.cos(a)*r, z = MEADOW.y+Math.sin(a)*r; sheep(continent,x,groundY(x,z),z,rand()*6.3); }
[[5.4,21.5],[5.55,22.4],[2.55,22.8]].forEach(([a,r])=>{ const x = Math.cos(a)*r, z = Math.sin(a)*r; deer(continent,x,groundY(x,z),z,rand()*6.3); });

// ── Islets: different sizes; big ones carry a hill, a pond, a stream and a waterfall, woods and animals; small ones a crystal
const islets = [1.3,4.6,2.1,5.8,2.8,3.6].map((sz,i)=>{ const n = 14, g = new THREE.Group();

  if (sz>=4){ // pond → stream → over the edge

    const ea = Math.atan2(pond.z,pond.x)+.15, er = Math.hypot(...outline[Math.round(((ea+Math.PI*2)%(Math.PI*2))/(Math.PI*2)*n)%n]);

    g.add(new THREE.Mesh(ribbon(stream, ()=>.35, (u,T)=>new THREE.Vector3().crossVectors(T,UP).normalize(), 30), water));

  if (sz<2.5){ const c = glow(new THREE.OctahedronGeometry(sz*.2), M.cyan, 0,sz*.45,0); g.add(c); spin.push([c,.6]); }
  const tspots = []; for (let t=0; tspots.length<Math.floor(sz*sz*.9) && t<400; t++){ const a = rand()*Math.PI*2, r = rand()*sz*.72, x = Math.cos(a)*r, z = Math.sin(a)*r;

  const a = i/6*Math.PI*2+.4, r = 36+sz*1.6, y = -3+rand()*6; g.position.set(Math.cos(a)*r,y,Math.sin(a)*r); g.rotation.y = rand()*6.3; scene.add(g);
  return { g, a, r, y, w:.015+rand()*.02 }; });

// birds: two flocks that fly out past the coast and loop back, wings flapping
const birdMat = new THREE.MeshStandardMaterial({ color:0xeef2f6, roughness:.7, side:THREE.DoubleSide });
const wingGeo = new THREE.BufferGeometry().setAttribute('position', new THREE.Float32BufferAttribute([0,0,-.1, 0,0,.12, .42,0,-.04],3)); wingGeo.computeVertexNormals();

const flyBirds = t=>birds.forEach(b=>{ birdAt(b,t,bp); birdAt(b,t+.05,bn); b.g.position.copy(bp); b.g.lookAt(bn);

const drift = [
  (t,dt)=>{ for (let i=0;i<FALL;i++){ let y = fallPos[i*3+1]-dt*2*fallSeed[i][3]; if (y<fallSeed[i][1]-16) y = fallSeed[i][1]; fallPos[i*3+1] = y; } drops.geometry.attributes.position.needsUpdate = true; },
  (t,dt)=>islets.forEach((o,i)=>{ o.a += dt*o.w*.3; o.g.position.set(Math.cos(o.a)*o.r, o.y+Math.sin(t*.6+i)*.35, Math.sin(o.a)*o.r); o.g.rotation.y += dt*o.w; }),

const motes = new THREE.Points(new THREE.BufferGeometry().setAttribute('position', new THREE.Float32BufferAttribute(Array.from({length:600*3},(_,i)=> i%3===1 ? Math.random()*14 : (Math.random()-.5)*50),3)),

// sky deck

// ── District base: floating graphite hex with a neon rim and underglow

const svgLoader = new SVGLoader();
function logo3D(svg, size, live){ // extrude each filled path; returns a group centred on its origin, front facing +z
  const data = svgLoader.parse(svg), vb = svg.match(/viewBox="([^"]+)"/)[1].split(/[ ,]+/).map(Number);
  const unit = Math.max(vb[2],vb[3]), depth = unit*.1, inner = new THREE.Group();
  data.paths.forEach(path=>{
    const up = !!path.userData.node.closest('.up');
    const m = new THREE.MeshPhysicalMaterial({ color:path.color, roughness:.28, metalness:.25, clearcoat:1, clearcoatRoughness:.1, envMapIntensity:.6,
      transparent:!live, opacity:live?1:.32, depthWrite:live });
    SVGLoader.createShapes(path).forEach(sh=>{
      const geo = new THREE.ExtrudeGeometry(sh,{ depth:up?depth*1.5:depth, bevelEnabled:true, bevelThickness:unit*.012, bevelSize:unit*.01, bevelSegments:2, curveSegments:16 });
      if (up) geo.translate(0,0,-depth*.5);
      const o = new THREE.Mesh(geo,m); o.castShadow = live; inner.add(o);
      if (!live) inner.add(new THREE.LineSegments(new THREE.EdgesGeometry(geo,25), new THREE.LineBasicMaterial({ color:0xfbbf24, transparent:true, opacity:.75 })));
    });
  });
  inner.rotation.x = Math.PI; // SVG y runs down; a half-turn about x flips it upright without mirroring
  inner.scale.setScalar(size/unit);
  const box = new THREE.Box3().setFromObject(inner), c = box.getCenter(new THREE.Vector3());
  inner.position.sub(c);
  const g = new THREE.Group(); g.add(inner); return g;
}

  g.add(mesh(new THREE.CylinderGeometry(2.25,2.35,.12,40,1,false,Math.PI*.62,Math.PI*.76), M.graphite, C.x,TOP+.06,C.z));
  // video wall: five panels on an arc, framed, on a curved backing

  { const back = M.graphite.clone(); back.side = THREE.DoubleSide; g.add(mesh(new THREE.CylinderGeometry(2.85,2.85,1.55,40,1,true,Math.PI*.7,Math.PI*.6), back, C.x,TOP+1.55,C.z)); }

  panel.innerHTML = `<span class="tag">Core service ${d.n}</span><h2>${d.name}</h2><p><b>${d.line}</b></p><p>${d.body}</p><ul>${
    d.list.map(([n,s])=>`<li><span>${s?`<button class="plink" data-p="${n}">${n}</button>`:n}</span>${s?`<span class="pill ${s}">${s==='live'?'Live':'Coming soon'}</span>`:''}</li>`).join('')}</ul>`;
  panel.classList.remove('hide');
}

// Product panel copy: SHIPPED features only, from _products/<name>/brief.md (checked 30 Sep – 22 Oct 2026). No prices.
const INFO = {
  G8Stack:{ tag:'API management', line:'A governed control centre for your organisation\'s APIs, on the Kong gateway.', where:'On your servers', url:'https://g8stack.com',
    points:['Approval workflow: nothing reaches the gateway unapproved','Self-service catalogue with auto-issued keys and access rights','Full audit trail of who approved what, and when','Live usage and error reporting','In production at UTM'] },

    points:['Describe the app once as a Blueprint','Recorded, resumable pipeline to a live HTTPS address','Promotion between environments, with approval','Logs, health checks, drift detection and rollback','Your code and data stay on your servers'] },
  GatherHub:{ tag:'Events platform', line:'A Malaysian event platform for the whole event, registration to certificate.', where:'Hosted', url:'https://gatherhub.app',
    points:['Registration with FPX and DuitNow QR payment','QR e-tickets by email','Check-in on crew phones, duplicates blocked','QR-verified certificates','Post-event reports and exports'] },
  Bliptrace:{ tag:'Error tracking', line:'Error tracking for every app: errors scrubbed of personal data and grouped into one inbox.', where:'Hosted', url:'https://bliptrace.com',
    points:['One backend for errors from every app, in any language','Personal data scrubbed before it is stored','Repeats grouped into one issue, with alerts and a triage inbox','Built in Malaysia'] },
  'DevHub Academy':{ tag:'Micro-credentials', line:'Learn it. Prove it. Show it. Short video series that end in a credential anyone can verify.', where:'Hosted', url:null,

};
const PRODUCT_LIVE = Object.fromEntries(PRODUCTS.map(([n,,l])=>[n,l]));
const slug = n => n.toLowerCase().replace(/\s+/g,'-');
let selectedLogo = null;
function focusProduct(name){
  followShip = false;
  if (tourTimer) stopTour();
  const entry = logos.find(([,,n])=>n===name); if (!entry) return;
  const [lg] = entry, info = INFO[name], live = PRODUCT_LIVE[name], plat = DISTRICTS[0];
  selectedLogo = lg; document.body.dataset.focus = 'platforms';
  DISTRICTS.forEach(x=>x.btn.setAttribute('aria-pressed', x===plat));
  const target = lg.getWorldPosition(new THREE.Vector3());
  const dir = target.clone().sub(plat.group.position).setY(0);
  if (dir.lengthSq()<1e-4) dir.set(1,0,0);
  const pos = target.clone().add(dir.normalize().multiplyScalar(4.6)).add(new THREE.Vector3(0,1.8,0));
  fly = { from:camera.position.clone(), fromT:controls.target.clone(), pos, target, t: reduce ? 1 : 0 };
  const host = info.url && new URL(info.url).host;
  panel.innerHTML = `<button class="back" data-d="platforms">← Platforms</button>
    <span class="tag">${info.tag} · ${info.where}</span><h2>${name} <span class="pill ${live?'live':'soon'}">${live?'Live':'Coming soon'}</span></h2>
    <p><b>${info.line}</b></p><ul class="points">${info.points.map(x=>`<li>${x}</li>`).join('')}</ul>
    ${host ? `<a class="cta" href="${info.url}" target="_blank" rel="noopener">Visit ${host}<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 17 17 7M8 7h9v9"/></svg></a>`
           : `<p class="quiet">Website not live yet.</p>`}`;
  panel.classList.remove('hide');
  history.replaceState(null,'','#'+slug(name));
}
panel.addEventListener('click', e=>{
  const pb = e.target.closest('[data-p]'); if (pb) return focusProduct(pb.dataset.p);
  const db = e.target.closest('[data-d]'); if (db) focus(DISTRICTS.find(x=>x.id===db.dataset.d));
});

// About panel: facts from _company-profile/company-profile.html
function focusHub(){
  followShip = false;
  if (tourTimer) stopTour();
  selectedLogo = null; document.body.dataset.focus = ''; DISTRICTS.forEach(x=>x.btn.setAttribute('aria-pressed', false));
  fly = { from:camera.position.clone(), fromT:controls.target.clone(), pos:new THREE.Vector3(15,12.5,17), target:new THREE.Vector3(0,5,0), t: reduce ? 1 : 0 };
  panel.innerHTML = `<span class="tag">About us</span><h2>Developers Hub Sdn. Bhd.</h2>
    <p><b>We build and look after software for universities, ministries and state agencies across Malaysia.</b></p>

      <li><b>Cleanique Coders</b><span>Where the team started</span></li>

    <a class="cta" href="https://devhub.my" target="_blank" rel="noopener">Visit devhub.my<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 17 17 7M8 7h9v9"/></svg></a>`;
  panel.classList.remove('hide'); panel.scrollTop = 0;
  history.replaceState(null,'','#about');
}
const ray = new THREE.Raycaster(), ptr = new THREE.Vector2(); let down;
renderer.domElement.addEventListener('pointerdown', e=>{ down = [e.clientX,e.clientY]; followShip = false; });
renderer.domElement.addEventListener('pointerup', e=>{
  if (!down || Math.hypot(e.clientX-down[0],e.clientY-down[1])>5) return; // a drag is an orbit, not a click
  ptr.set(e.clientX/innerWidth*2-1, -(e.clientY/innerHeight)*2+1); ray.setFromCamera(ptr,camera);
  const u = ray.intersectObjects([...pickables, airship],true).find(h=>{ const d = h.object.userData; return d.product || d.hub || d.district || d.ship; })?.object.userData; // nearest thing wins
  if (u?.product) return focusProduct(u.product);
  if (u?.hub) return focusHub();
  if (u?.ship){ followShip = true; panel.classList.add('hide'); return; }
  focus(u ? u.district : null);
});
addEventListener('keydown', e=>{ if (e.key==='Escape'){ stopTour(); focus(null); } const i = '1234'.indexOf(e.key); if (i>=0) focus(DISTRICTS[i]); });
addEventListener('resize', ()=>{ camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth,innerHeight); composer.setSize(innerWidth,innerHeight); labels.setSize(innerWidth,innerHeight); });

// ── Tour: hub, then each district, with a caption. #tour loops it for a kiosk or booth screen
const caption = document.getElementById('caption'), kiosk = location.hash==='#tour';
const TOUR = [[null,'<b>Developers Hub</b> — one team that builds, runs and teaches software for Malaysia.'],
  ...DISTRICTS.map(d=>[d,`<b>${d.n} ${d.name}</b> — ${d.line}`]),
  [null,'Three sectors: <b>government</b>, <b>higher education</b> and <b>industry</b>.']];
let tourTimer = null;

// ── Looks. Studio follows 3dviz-pro-max's dark-studio-product rig (examples/shared/lighting-studio.js): three soft
// RectAreaLight panels, key:fill ≈ 3:1, a low environment, gradient set, no bloom, satin materials, neon kept as accents.
// Night is the neon + bloom version for dark booth screens. Panel sizes are scaled up from the example so that
// intensity × area / distance² matches it at campus scale.
RectAreaLightUniformsLib.init();
const daySky = canvasTex(4,256,x=>{ const g = x.createLinearGradient(0,0,0,256); g.addColorStop(0,'#2f7fd6'); g.addColorStop(.55,'#7fb8ea'); g.addColorStop(1,'#d7ecfb'); x.fillStyle = g; x.fillRect(0,0,4,256); });
// night sky: three star layers twinkling out of phase
const stars = [0,1,2].map(k=>{ const n = 700, pos = new Float32Array(n*3);
  for (let i=0;i<n;i++){ const u = rand()*2-1, a = rand()*Math.PI*2, r = 170, q = Math.sqrt(1-u*u); pos.set([Math.cos(a)*q*r, u*r, Math.sin(a)*q*r], i*3); }
  const pts = new THREE.Points(new THREE.BufferGeometry().setAttribute('position', new THREE.BufferAttribute(pos,3)),
    new THREE.PointsMaterial({ color:[0xffffff,0xcfe3ff,0xfff1d6][k], size:[1.4,2,2.6][k], sizeAttenuation:false, transparent:true, depthWrite:false, fog:false }));
  scene.add(pts); return { pts, f:[1.3,2.1,.8][k], ph:k*2.1 }; });
drift.push(t=>stars.forEach(s2=>s2.pts.material.opacity = .3+.7*Math.abs(Math.sin(t*s2.f+s2.ph))));
const SUBJECT = new THREE.Vector3(0,2,0);
const panels = [[0xffffff,6.5,22,30,35,315],[0xeaf0ff,2.9,30,18,15,60],[0xffffff,4,8,26,25,170]].map(([c,i,w,h,el,az])=>{
  const l = new THREE.RectAreaLight(c,i,w,h); l.position.setFromSphericalCoords(36, THREE.MathUtils.degToRad(90-el), THREE.MathUtils.degToRad(az)).add(SUBJECT);
  l.lookAt(SUBJECT); scene.add(l); return l; });
const LOOK = {
  studio:{ label:'Night look', exposure:1, bloom:false, hemi:.55, key:1.35, keyColor:0xfff1dc, sky:0xbfdcf7, ground:0x3d5a3d, env:.7, neon:.55, fog:new THREE.Fog(0xd7ecfb,95,230), bg:daySky, glow:false, spire:0, stars:false,
    mat:{ hull:{ roughness:.42, metalness:.05, clearcoat:.25 }, graphite:{ roughness:.6, metalness:.35, clearcoat:.1 }, floor:{ roughness:.92, metalness:.05, color:0x15181d } } },
  night:{ label:'Day look', exposure:1.05, bloom:true, hemi:.35, key:1, keyColor:0xdbeafe, sky:0x93c5fd, ground:0x070d1a, env:1, neon:1, stars:true, fog:new THREE.FogExp2(0x070d1a,.012), bg:new THREE.Color(0x070d1a), glow:true, spire:5,
    mat:{ hull:{ roughness:.25, metalness:.15, clearcoat:1 }, graphite:{ roughness:.32, metalness:.85, clearcoat:.6 }, floor:{ roughness:.38, metalness:.7, color:0x0b1324 } } },
};
let look = 'studio', neonK = 1;
function applyLook(name){
  look = name; const L = LOOK[name]; neonK = L.neon;
  renderer.toneMappingExposure = L.exposure; bloom.enabled = L.bloom; scene.fog = L.fog; scene.background = L.bg;
  hemi.intensity = L.hemi; hemi.color.setHex(L.sky); hemi.groundColor.setHex(L.ground); key.intensity = L.key; key.color.setHex(L.keyColor); stars.forEach(s2=>s2.pts.visible = L.stars); spireLight.intensity = L.spire; panels.forEach(p=>p.visible = !L.bloom);
  pools.forEach(o=>o.visible = L.glow); motes.visible = L.glow;
  const seen = new Set();
  scene.traverse(o=>[].concat(o.material||[]).forEach(m=>{ if (seen.has(m)) return; seen.add(m);
    const kind = m.userData.kind; if (kind){ const v = L.mat[kind]; for (const k in v) k==='color' ? m.color.setHex(v[k]) : (m[k] = v[k]); }
    if ('envMapIntensity' in m){ m.userData.env0 ??= m.envMapIntensity; m.envMapIntensity = m.userData.env0*L.env; }
    if (m.toneMapped===false && !m.map && !m.userData.dynamic && m.color){ m.userData.c0 ??= m.color.clone(); m.color.copy(m.userData.c0).multiplyScalar(L.neon); } }));
  lookBtn.textContent = L.label; lookBtn.setAttribute('aria-label', `Switch to ${L.label.toLowerCase()}`);
  try { localStorage.setItem('dh3d-look', name); } catch {}
}
const lookBtn = document.createElement('button');
lookBtn.onclick = ()=>applyLook(look==='studio' ? 'night' : 'studio');
navEl.prepend(lookBtn);
addEventListener('keydown', e=>{ if (e.key==='n' || e.key==='N') lookBtn.onclick(); });
const tourBtn = document.createElement('button'); tourBtn.textContent = 'Play tour'; tourBtn.setAttribute('aria-pressed',false);
tourBtn.onclick = ()=> tourTimer ? stopTour() : tour(0);
navEl.prepend(tourBtn);
function tour(i){
  if (i>=TOUR.length){ if (kiosk) i = 0; else { stopTour(); focus(null); return; } }
  const [d,text] = TOUR[i]; focus(d, true);
  caption.innerHTML = text; caption.classList.remove('hide');
  tourBtn.textContent = 'Stop tour'; tourBtn.setAttribute('aria-pressed',true);
  tourTimer = setTimeout(()=>tour(i+1), d ? 6500 : 4500);
}
function stopTour(){ clearTimeout(tourTimer); tourTimer = null; caption.classList.add('hide'); tourBtn.textContent = 'Play tour'; tourBtn.setAttribute('aria-pressed',false); }
renderer.domElement.addEventListener('pointerdown', ()=>{ if (tourTimer) stopTour(); });
addEventListener('keydown', e=>{ if (e.key==='t' || e.key==='T') tourTimer ? stopTour() : tour(0); });

{ let saved = null; try { saved = localStorage.getItem('dh3d-look'); } catch {}
  applyLook(new URLSearchParams(location.search).get('look') || (saved in LOOK ? saved : 'studio')); } // ?look=night for a booth
if (new URLSearchParams(location.search).has('embed')) document.body.classList.add('embed');
addEventListener('message', e=>{ if (e.origin===location.origin && e.data?.type==='dh3d:look' && e.data.look in LOOK) applyLook(e.data.look); }); // same-origin host page only
if (kiosk) tour(0);
{ const h = location.hash.slice(1), d = DISTRICTS.find(d=>d.id===h), pr = PRODUCTS.find(([n])=>slug(n)===h);
  if (h==='airship') followShip = true; else if (h==='about') focusHub(); else if (d) focus(d); else if (pr) focusProduct(pr[0]); } // deep link, e.g. #platforms or #g8deck

// ── Loop
const wp = new THREE.Vector3(), clock = new THREE.Clock(), tan = new THREE.Vector3();
function placePacket(o){ o.curve.getPointAt(o.t,o.p.position); o.curve.getTangentAt(o.t,tan); o.p.quaternion.setFromUnitVectors(THREE.Object3D.DEFAULT_UP,tan); }
let frameNo = 0, slowAvg = 1/60, lowPower = false; const shipCam = new THREE.Vector3();
renderer.setAnimationLoop(()=>{
  const dt = Math.min(clock.getDelta(),.05), t = clock.elapsedTime;
  if (fly){ fly.t = Math.min(1, fly.t+dt/1.4); const k = ease(fly.t);
    camera.position.lerpVectors(fly.from,fly.pos,k); controls.target.lerpVectors(fly.fromT,fly.target,k); if (fly.t>=1) fly = null; }
  if (!reduce){
    spin.forEach(([o,s,ax='y'])=>o.rotation[ax] += dt*s);
    bob.forEach(([o,y])=>o.position.y = y+Math.sin(t*1.4)*.12);
    packets.forEach(o=>{ o.t = (o.t+dt*.3)%1; placePacket(o); });
    outbound.forEach(o=>{ const n = o.t+dt*.35; if (n>=1) o.sector.pulse = 1; o.t = n%1; placePacket(o); });
    sectorArcs.forEach(a=>{ a.pulse = Math.max(0,a.pulse-dt*1.5); a.mats.forEach((m,j)=>m.color.copy(a.base[j]).multiplyScalar((1+a.pulse*1.4)*neonK)); });
    logos.forEach(([o,i,n])=>{ if (!n) return; o.position.y = TOP+1.7+Math.sin(t*1.3+i)*.08; o.scale.setScalar(THREE.MathUtils.damp(o.scale.x, o===selectedLogo?1.35:1, 6, dt)); });
    winTex.offset.x += dt*.01; winTex.offset.y += dt*.025; beacon.material.opacity = Math.sin(t*2.5)>.4 ? 1 : .15;
    mixers.forEach(m=>m.update(dt));
    ticks.forEach(f=>f(t,dt));
    motes.rotation.y += dt*.02; drift.forEach(f=>f(t,dt));
  } else { packets.forEach(placePacket); outbound.forEach(placePacket); logos.forEach(([o,,n])=>n && o.scale.setScalar(o===selectedLogo?1.35:1)); }
  logos.forEach(([o])=>{ o.getWorldPosition(wp); o.lookAt(camera.position.x, wp.y, camera.position.z); }); // marks turn to face the viewer, upright
  if (followShip){ const k = reduce ? 1 : .08; camera.position.lerp(shipCam.set(2,2.2,12).applyQuaternion(airship.quaternion).add(airship.position), k); controls.target.lerp(airship.position, reduce ? 1 : .15); }
  if (frameNo++%60===0) renderer.shadowMap.needsUpdate = true;
  // performance mode: if frames stay slow, drop resolution and shadows once
  slowAvg = slowAvg*.97 + dt*.03; if (!lowPower && frameNo>120 && slowAvg>1/32){ lowPower = true; renderer.setPixelRatio(1); composer.setPixelRatio(1); key.castShadow = false; console.info('[dh3d] performance mode on'); }
  controls.update(); composer.render(); labels.render(scene,camera);
});
</script>
